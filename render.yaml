services:
  - type: web
    name: flowstate-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: flowstate-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PRODUCTIVITY_DB_PATH
        value: /var/data/productivity.db
      - key: PRODUCTIVITY_JWT_SECRET
        generateValue: true
      - key: PRODUCTIVITY_SMTP_EMAIL
        sync: false
      - key: PRODUCTIVITY_SMTP_APP_PASSWORD
        sync: false
      - key: PRODUCTIVITY_SMTP_HOST
        value: smtp.gmail.com
      - key: PRODUCTIVITY_SMTP_PORT
        value: "587"
