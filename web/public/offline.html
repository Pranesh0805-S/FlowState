<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#182a22" />
    <title>Flowstate is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f7f8f4; color: #17221e; font: 16px/1.5 Arial, sans-serif; }
      main { width: min(420px, 100%); padding: 34px; border: 1px solid #e7eae4; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 18px 55px rgba(29,46,36,.07); }
      .mark { width: 48px; height: 48px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 15px; background: #d9ed9e; color: #182a22; font-size: 26px; }
      h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.04em; }
      p { margin: 0; color: #76817a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <h1>You’re offline for now.</h1>
      <p>Reconnect to the internet to open your Flowstate workspace and sync your latest changes.</p>
    </main>
  </body>
</html>
